apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: insuretech-deployment
  namespace: default
spec:
  maxReplicas: 10
  minReplicas: 1
  metrics:
    - type: Pods
      pods:
        metric:
          # Metric is provided by prometheus-adapter from Prometheus series.
          # Name must match what adapter publishes in custom.metrics.k8s.io.
          name: http_requests_total
        target:
          type: AverageValue
          averageValue: "10"
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: insuretech-deployment