apiVersion: apps/v1
kind: Deployment
metadata:
  name: insuretech-deployment
spec:
  selector:
    matchLabels:
      app: insuretech
  template:
    metadata:
      labels:
        app: insuretech
    spec:
      containers:
        - name: insuretech-app
          image: ghcr.io/yandex-practicum/scaletestapp:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "500m"
              memory: "10Mi"
            requests:
              cpu: "200m"
              memory: "5Mi"

---

apiVersion: v1
kind: Service
metadata:
  name: insuretech-lb
spec:
  type: NodePort
  selector:
    app: insuretech
  ports:
    - name: http
      port: 80
      targetPort: 8080