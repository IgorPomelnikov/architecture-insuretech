prometheus:
  url: http://monitoring-kube-prometheus-prometheus.monitoring.svc
  port: 9090

rules:
  # Keep default Kubernetes-related rules if needed.
  default: true
  custom:
    - seriesQuery: '{__name__="http_requests_total",namespace!="",pod!=""}'
      resources:
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      # Keep the same metric name in HPA and adapter to avoid naming mismatch.
      name:
        matches: "^http_requests_total$"
        as: "http_requests_total"
      metricsQuery: 'sum(rate(http_requests_total{<<.LabelMatchers>>}[2m])) by (<<.GroupBy>>)'
